name: PLEX Premium Android APK
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/PLEX.apk"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Production web build
        run: npm run build
      - name: Prepare Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Generate Android icon and splash
        run: |
          npx @capacitor/assets@latest generate --android
      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Publish APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" public/PLEX.apk
      - name: Verify APK size
        run: |
          SIZE=$(stat -c%s public/PLEX.apk)
          echo "PLEX APK bytes: $SIZE"
          echo "PLEX APK MB: $(awk "BEGIN {printf \"%.2f\", $SIZE/1000000}")"
          if [ "$SIZE" -lt 70000000 ]; then
            echo "ERROR: APK is below 70 MB."
            exit 1
          fi
          echo "70 MB+ APK target PASSED."
      - name: Commit APK to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/PLEX.apk
          git commit -m "build: PLEX Premium 70MB+ Android APK" || echo "APK unchanged"
          git push
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.1.0 >/dev/null 2>&1 || \
          gh release create v3.1.0 \
            --title "PLEX Premium v3.1.0" \
            --notes "PLEX Premium Android APK with high-resolution bundled cinematic assets, premium icon/splash, offline shell and installable Android package."
          gh release upload v3.1.0 public/PLEX.apk --clobber
