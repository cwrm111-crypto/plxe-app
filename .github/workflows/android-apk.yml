name: PLEX Android APK
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/PLEX.apk"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew clean assembleDebug --no-daemon
      - name: Publish APK to website
        run: cp android/app/build/outputs/apk/debug/app-debug.apk public/PLEX.apk
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/PLEX.apk
          git commit -m "build: refresh PLEX Android APK" || echo "No APK change"
          git push
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.0.0 >/dev/null 2>&1 || gh release create v3.0.0 --title "PLEX v3.0.0" --notes "PLEX Android APK release"
          gh release upload v3.0.0 public/PLEX.apk --clobber
