name: PLEX Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/PLEX.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - working-directory: android
        run: chmod +x gradlew && ./gradlew clean assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk public/PLEX.apk
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/PLEX.apk
          git commit -m "build: update PLEX Android APK" || echo "No APK change"
          git push
